#####################################################################
# Rook 2020 MK2 + BTT SKR Pico
# Clean baseline configuration
# Printable bed: 120 x 120 mm
#####################################################################

[include mainsail.cfg]
[exclude_object]
[print_stats]

[gcode_arcs]
resolution: 1.0

#####################################################################
# MCU
#####################################################################

[mcu]
serial: /dev/serial0
restart_method: command

#####################################################################
# Printer
#####################################################################

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 10000
max_z_velocity: 15
max_z_accel: 50
square_corner_velocity: 5.0

[idle_timeout]
timeout: 1800

#####################################################################
# X Axis - CoreXY / Sensorless Homing
#####################################################################

[stepper_x]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12

rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200

endstop_pin: tmc2209_stepper_x:virtual_endstop

position_min: 0
position_endstop: 120
position_max: 120

homing_speed: 20
homing_retract_dist: 0
homing_positive_dir: true


[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0

interpolate: False
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0

diag_pin: ^gpio4
driver_SGTHRS: 50

#####################################################################
# Y Axis - CoreXY / Sensorless Homing
#####################################################################

[stepper_y]
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_endstop: 120
position_max: 120
homing_speed: 40
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
interpolate: False
run_current: 0.90
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^gpio3
driver_SGTHRS: 115

#####################################################################
# Z Axis
# Leadscrew-style rotation_distance of 8 mm.
#####################################################################

[stepper_z]
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2

rotation_distance: 8
microsteps: 16

endstop_pin: ^!gpio25

# Physical endstop is at the top of Z travel.
# Old nozzle-at-bed location was Z=27.5, so coordinates are shifted
# down by 27.5 mm. The bed surface is now Z=0.
position_endstop: 92.500
position_min: 0
position_max: 92.500

homing_speed: 10
second_homing_speed: 3.0
homing_retract_dist: 3.0
homing_positive_dir: true


[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1

interpolate: True
run_current: 0.4
sense_resistor: 0.110
stealthchop_threshold: 999999

#####################################################################
# Extruder
# rotation_distance 53.0 with gear_ratio 9.5:1 is the value in use; it has
# not been calibrated yet. Calibrate rotation_distance after the
# motor/wiring is confirmed good.
#####################################################################

[extruder]
step_pin: gpio14
dir_pin: !gpio13
enable_pin: !gpio15

microsteps: 16
rotation_distance: 53.0
gear_ratio: 9.5:1

nozzle_diameter: 0.400
filament_diameter: 1.750

heater_pin: gpio23
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio27

min_temp: 0
max_temp: 300
min_extrude_temp: 170

max_extrude_only_distance: 150
max_extrude_cross_section: 5

pressure_advance: 0.06
pressure_advance_smooth_time: 0.040

control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982


[tmc2209 extruder]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3

interpolate: True
run_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# Heated Bed
#####################################################################

[heater_bed]
heater_pin: gpio21
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: gpio26
smooth_time: 3.0
min_temp: 0
max_temp: 120
control: pid
pid_kp: 68.453
pid_ki: 2.749
pid_kd: 426.122

#####################################################################
# Bed Screws - 120 x 120 mm bed
#####################################################################

[bed_screws]
screw1: 60,5
screw1_name: front screw
screw2: 5,115
screw2_name: back left
screw3: 115,115
screw3_name: back right

#####################################################################
# Retraction
#####################################################################

[firmware_retraction]
retract_length: 1.0
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 60

#####################################################################
# Fans
#####################################################################

# Normal slicer-controlled part cooling fan
[fan]
pin: gpio17
max_power: 1.0
cycle_time: 0.01
off_below: 0.01

# Hotend heatsink fan - leave this dedicated to the hotend
[heater_fan hotend_fan]
pin: gpio18
heater: extruder
heater_temp: 50.0
max_power: 1.0

# Repurposed fan output, always on.
# 0.40 = 40% PWM duty cycle.
[output_pin always_on_fan]
pin: gpio20
pwm: True
cycle_time: 0.01
value: 0.40
shutdown_value: 0

#####################################################################
# Temperature Monitoring
#####################################################################

[temperature_sensor Raspberry_Pi]
sensor_type: temperature_host

[temperature_sensor SKR_Pico]
sensor_type: temperature_mcu
sensor_mcu: mcu

#####################################################################
# Sensorless Homing Macros
#####################################################################

[gcode_macro _HOME_X]
gcode:
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.70 %}

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}
    SAVE_GCODE_STATE NAME=STATE_HOME_X

    G28 X

    G91
    G1 X-10 F1200
    G4 P2000

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}
    RESTORE_GCODE_STATE NAME=STATE_HOME_X

[gcode_macro _HOME_Y]
gcode:
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = 0.70 %}

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}
    SAVE_GCODE_STATE NAME=STATE_HOME_Y

    G28 Y

    G91
    G1 Y-10 F1200
    G4 P2000

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}
    RESTORE_GCODE_STATE NAME=STATE_HOME_Y

#####################################################################
# Homing Override
# Z homes first because the Z endstop is configured at Z maximum.
#####################################################################

[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    SAVE_GCODE_STATE NAME=STATE_HOME_OVERRIDE

    {% if home_all or 'Z' in params %}
        G28 Z
    {% endif %}

    {% if home_all or 'X' in params %}
        _HOME_X
    {% endif %}

    {% if home_all or 'Y' in params %}
        _HOME_Y
    {% endif %}

    G90
    RESTORE_GCODE_STATE NAME=STATE_HOME_OVERRIDE

#####################################################################
# Utility Macros
#####################################################################

[gcode_macro CHOME]
description: Home any axes that are not already homed
gcode:
    {% if 'x' not in printer.toolhead.homed_axes or
          'y' not in printer.toolhead.homed_axes or
          'z' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

[gcode_macro PARK]
description: Move toolhead to center of the 120 x 120 build plate
gcode:
    CHOME
    G90
    G1 X60 Y60 F7800

#####################################################################
# IMPORTANT XY RANGE NOTE
#####################################################################
#
# The standard Rook 2020 MK2 printable area is 120 x 120 mm.
# Do NOT set position_max to the ~200 mm frame dimension.
#
# If your particular toolhead can physically move beyond the bed, you can
# later expose that extra NON-PRINTING travel using position_min / max.
# Measure the real hard-stop-to-hard-stop nozzle travel first.
#
# Example ONLY, do not enable without measuring:
#   position_min: -5
#   position_endstop: 125
#   position_max: 125
#
# That would keep the bed at X/Y = 0..120 while allowing 5 mm travel beyond
# each bed edge. The correct numbers depend on YOUR toolhead and carriage.
#####################################################################

#####################################################################
# Print Start / End Macros
#####################################################################

[gcode_macro PRINT_START]
description: Start print sequence
gcode:
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(200)|float %}

    # Start heating bed
    M140 S{BED_TEMP}

    # Home printer
    G28

    # Wait for bed
    M190 S{BED_TEMP}

    # Heat hotend
    M104 S{EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP}

    # Absolute positioning
    G90

    # Reset extruder position
    G92 E0

    # Move slightly above bed
    G1 Z5 F600
